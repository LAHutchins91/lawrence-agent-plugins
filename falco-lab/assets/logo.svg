<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="falco-lab">
  <defs>
    <linearGradient id="falcoBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2e1a"/>
      <stop offset="100%" stop-color="#0a140a"/>
    </linearGradient>
    <radialGradient id="eyeGlow" cx="50%" cy="45%" r="40%">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#falcoBg)"/>
  <circle cx="64" cy="56" r="36" fill="url(#eyeGlow)"/>
  <!-- falcon eye outline -->
  <ellipse cx="64" cy="56" rx="34" ry="22" fill="none" stroke="#4ade80" stroke-width="4"/>
  <!-- iris -->
  <circle cx="64" cy="56" r="12" fill="#22c55e"/>
  <!-- pupil -->
  <circle cx="64" cy="56" r="5.5" fill="#052e16"/>
  <!-- eye highlight -->
  <circle cx="60" cy="52" r="2.2" fill="#bbf7d0"/>
  <!-- falcon beak hint (small chevron under eye) -->
  <path d="M64 78 L56 88 L64 84 L72 88 Z" fill="#fbbf24"/>
  <!-- wing accents -->
  <path d="M28 70 Q40 58 48 66" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
  <path d="M100 70 Q88 58 80 66" fill="none" stroke="#86efac" stroke-width="3" stroke-linecap="round"/>
  <text x="64" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="10" font-weight="700" fill="#bbf7d0">FALCO</text>
</svg>
