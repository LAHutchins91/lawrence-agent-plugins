<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="JSON Lint Lab logo">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
  </defs>
  <rect width="256" height="256" rx="52" fill="url(#bg)"/>
  <!-- JSON braces -->
  <text x="58" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="96" font-weight="700" fill="#F59E0B">{</text>
  <text x="168" y="150" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="96" font-weight="700" fill="#F59E0B">}</text>
  <!-- key:value hint -->
  <text x="96" y="118" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="22" font-weight="700" fill="#FDE68A">"k"</text>
  <text x="128" y="148" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="20" font-weight="700" fill="#93C5FD">:1</text>
  <!-- lint magnifier -->
  <circle cx="190" cy="78" r="18" fill="none" stroke="#34D399" stroke-width="8"/>
  <path d="M202 90 l18 18" fill="none" stroke="#34D399" stroke-width="8" stroke-linecap="round"/>
  <text x="128" y="228" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="14" font-weight="700" fill="#FCD34D">JSON Lint</text>
</svg>
