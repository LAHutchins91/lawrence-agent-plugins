<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128" role="img" aria-label="gatekeeper-lab">
  <defs>
    <linearGradient id="gateBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0c1929"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#gateBg)"/>
  <!-- arched gate frame -->
  <path d="M36 98 L36 52 Q36 28 64 28 Q92 28 92 52 L92 98" fill="none" stroke="#38bdf8" stroke-width="5" stroke-linecap="round"/>
  <!-- gate bars -->
  <line x1="50" y1="48" x2="50" y2="98" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  <line x1="64" y1="42" x2="64" y2="98" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  <line x1="78" y1="48" x2="78" y2="98" stroke="#7dd3fc" stroke-width="4" stroke-linecap="round"/>
  <!-- lock body -->
  <rect x="54" y="68" width="20" height="16" rx="3" fill="#fbbf24"/>
  <!-- lock shackle -->
  <path d="M58 68 L58 60 Q58 52 64 52 Q70 52 70 60 L70 68" fill="none" stroke="#fbbf24" stroke-width="3.5" stroke-linecap="round"/>
  <!-- keyhole -->
  <circle cx="64" cy="74" r="2.2" fill="#0c1929"/>
  <rect x="62.5" y="75" width="3" height="5" rx="1" fill="#0c1929"/>
  <text x="64" y="118" text-anchor="middle" font-family="ui-sans-serif,system-ui,sans-serif" font-size="8" font-weight="700" fill="#bae6fd">GATEKEEPER</text>
</svg>
